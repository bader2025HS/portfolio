<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Moved</title>

<meta http-equiv="refresh" content="5; url=https://basilesuliman.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#12382b;
    --text:#f7faf8;
    --muted:rgba(255,255,255,.78);
    --button:#8fd2bf;
    --button-hover:#ffffff;
    --button-text:#12382b;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px;

    background:var(--bg);
    color:var(--text);

    font-family:"Manrope",sans-serif;
}

.container{
    width:100%;
    max-width:760px;
    text-align:center;
}

h1{
    margin-bottom:42px;

    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(3.4rem,8vw,6.8rem);
    font-weight:700;
    line-height:.9;
    letter-spacing:-0.06em;
}

.subtitle{
    font-size:1.45rem;
    line-height:1.7;
    color:var(--muted);
}

.button{
    display:inline-flex;
    align-items:center;
    gap:14px;

    margin:58px 0 36px;
    padding:20px 42px;

    background:var(--button);
    color:var(--button-text);

    text-decoration:none;

    font-family:"Space Grotesk",sans-serif;
    font-size:1rem;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;

    transition:
        transform .25s ease,
        background .25s ease;
}

.button:hover{
    background:var(--button-hover);
    transform:translateY(-3px);
}

.redirect{
    font-size:1rem;
    color:rgba(255,255,255,.58);
}

@media (max-width:700px){

    body{
        padding:28px;
    }

    h1{
        margin-bottom:28px;
    }

    .subtitle{
        font-size:1.15rem;
    }

    .button{
        width:100%;
        justify-content:center;

        padding:18px 24px;

        font-size:.9rem;
        letter-spacing:.12em;
    }

}
</style>

</head>

<body>

<div class="container">

    <h1>Portfolio Moved</h1>

    <p class="subtitle">
        Please visit my updated portfolio.
    </p>

    <a class="button" href="https://basilesuliman.com">
        basilesuliman.com
        <span>→</span>
    </a>

    <p class="redirect">
        Redirecting automatically in 5 seconds...
    </p>

</div>

</body>
</html>
