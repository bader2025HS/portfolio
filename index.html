<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Moved</title>

<meta http-equiv="refresh" content="5; url=https://basilesuliman.com">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px;

    background:#12382b;
    color:#f6fbf8;

    font-family:"Manrope",Arial,sans-serif;
}

.container{
    max-width:620px;
    text-align:center;
}

h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(2.5rem,6vw,4rem);
    font-weight:700;
    line-height:0.95;

    margin-bottom:28px;
}

p{
    font-size:1.1rem;
    line-height:1.8;

    color:rgba(255,255,255,.82);
}

.button{
    display:inline-block;

    margin:42px 0 28px;
    padding:16px 34px;

    background:#8ed4bf;
    color:#12382b;

    text-decoration:none;

    font-family:"Space Grotesk",sans-serif;
    font-size:.92rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;

    transition:
        background .25s ease,
        transform .25s ease;
}

.button:hover{
    background:#ffffff;
    transform:translateY(-2px);
}

.redirect{
    font-size:.92rem;
    color:rgba(255,255,255,.6);
}
</style>

</head>

<body>

<div class="container">

    <h1>Portfolio Moved</h1>

    <p>
        Please visit my updated portfolio.
    </p>

    <a class="button" href="https://basilesuliman.com">
        basilesuliman.com →
    </a>

    <p class="redirect">
        Redirecting automatically in 5 seconds...
    </p>

</div>

</body>
</html>
